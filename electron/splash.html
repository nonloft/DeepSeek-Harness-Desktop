<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: #111827;
        --line: #1f2937;
        --text: #e5e7eb;
        --muted: #8b95a7;
        --accent: #4f8cff;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background:
          radial-gradient(1200px 600px at 50% -10%, #16233a 0%, transparent 60%),
          var(--bg);
        color: var(--text);
        font: 14px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        width: min(680px, 100%);
        -webkit-app-region: no-drag;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(145deg, #2563eb, #0ea5e9);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px -8px #2563eb99;
        flex: none;
      }
      .mark svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #fff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 24px;
        font-size: 14px;
        color: var(--text);
      }
      .spinner {
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 50%;
        border: 2px solid #ffffff1a;
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .bar {
        margin-top: 16px;
        height: 3px;
        border-radius: 3px;
        background: #ffffff12;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .hint {
        margin-top: 22px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .hint code {
        background: #ffffff0d;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 5px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 11.5px;
      }

      /* error state */
      .error-box {
        border: 1px solid #7f1d1d;
        background: #180d0f;
        border-radius: 12px;
        padding: 18px 20px;
        margin-top: 20px;
        display: none;
      }
      .error-box.show {
        display: block;
      }
      .error-box h2 {
        margin: 0 0 6px;
        font-size: 15px;
        color: var(--danger);
        font-weight: 600;
      }
      .error-box p {
        margin: 0;
        color: #d4b4b8;
        white-space: pre-wrap;
        font-size: 13px;
      }
      pre.log {
        margin: 14px 0 0;
        max-height: 220px;
        overflow: auto;
        background: #0a0d13;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font: 11.5px/1.5 "Cascadia Mono", Consolas, monospace;
        color: #9aa4b2;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #182030;
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        background: #1e293b;
        border-color: #334155;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: #5f97ff;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24">
            <path d="M4 7l7 5-7 5" />
            <path d="M13 17h7" />
          </svg>
        </div>
        <div>
          <h1>DeepSeek Harness</h1>
          <p>агент в отдельном окне</p>
        </div>
      </div>

      <div id="running">
        <div class="status">
          <span class="spinner"></span>
          <span id="status-text">Запускаю агента…</span>
        </div>
        <div class="bar"><i></i></div>
        <div class="hint">
          Поднимаю локальный процесс <code>dsh web</code>. Первый запуск иногда занимает до минуты.
        </div>
      </div>

      <div id="error" class="error-box">
        <h2 id="error-title">Что-то пошло не так</h2>
        <p id="error-message"></p>
        <pre id="error-log" class="log"></pre>
        <div class="actions">
          <button class="primary" id="retry">Перезапустить</button>
          <button id="copy">Скопировать лог</button>
          <button id="docs">Документация</button>
        </div>
      </div>
    </div>

    <script>
      const statusText = document.getElementById('status-text');
      const running = document.getElementById('running');
      const errorBox = document.getElementById('error');
      const errorTitle = document.getElementById('error-title');
      const errorMessage = document.getElementById('error-message');
      const errorLog = document.getElementById('error-log');
      const logLines = [];

      function setStatus(payload) {
        if (!payload) return;
        if (payload.phase === 'error') {
          running.classList.add('hidden');
          errorBox.classList.add('show');
          errorTitle.textContent = payload.title || 'Ошибка';
          errorMessage.textContent = payload.message || '';
          if (payload.log) errorLog.textContent = payload.log;
          return;
        }
        running.classList.remove('hidden');
        errorBox.classList.remove('show');
        if (payload.message) statusText.textContent = payload.message;
      }

      if (window.shell) {
        window.shell.onStatus(setStatus);
        window.shell.onLog((text) => {
          if (!text) return;
          logLines.push(text);
          if (logLines.length > 120) logLines.shift();
          if (errorBox.classList.contains('show')) {
            errorLog.textContent = logLines.join('\n');
            errorLog.scrollTop = errorLog.scrollHeight;
          }
        });
      }

      document.getElementById('retry').addEventListener('click', () => {
        errorBox.classList.remove('show');
        running.classList.remove('hidden');
        statusText.textContent = 'Перезапускаю агента…';
        if (window.shell) window.shell.retry();
      });

      document.getElementById('copy').addEventListener('click', async () => {
        if (!window.shell) return;
        await window.shell.readLog().then((log) => {
          navigator.clipboard?.writeText(errorLog.textContent || log || '');
        });
        const button = document.getElementById('copy');
        button.textContent = 'Скопировано';
        setTimeout(() => (button.textContent = 'Скопировать лог'), 1500);
      });

      document.getElementById('docs').addEventListener('click', () => {
        if (window.shell) {
          window.shell.openExternal('https://github.com/deepseek-ai/deepseek-harness');
        }
      });
    </script>
  </body>
</html>
